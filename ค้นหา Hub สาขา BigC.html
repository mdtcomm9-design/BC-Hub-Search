function hubClass(hub) {
  if (!hub || hub.trim() === '-' || hub.trim().toUpperCase() === 'TBC') return 'hub-pill tbc';
  return 'hub-pill';
}
function hubLabel(hub) {
  if (!hub || hub.trim() === '-') return 'ยังไม่กำหนด';
  return hub;
}
function val(v) {
  return (v === null || v === undefined || v === '') ? '—' : v;
}

function render(items) {
  list.innerHTML = '';
  if (items.length === 0) {
    empty.style.display = 'block';
    count.textContent = '';
    return;
  }
  empty.style.display = 'none';
  count.textContent = `พบ ${items.length} สาขา`;
  const frag = document.createDocumentFragment();
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="store-name">${item.saka || '—'}</div>
          <div class="hyper">${item.hyper_store || ''}</div>
        </div>
        <div class="code-block">
          <div class="code-label">Store No</div>
          <div class="code">#${val(item.code_bigc)}</div>
        </div>
      </div>
      <div class="grid">
        <div class="field">
          <div class="field-label">HUB</div>
          <div class="field-value"><span class="${hubClass(item.hub)}">${hubLabel(item.hub)}</span></div>
        </div>
        <div class="field">
          <div class="field-label">Plant</div>
          <div class="field-value">${val(item.plant)}</div>
        </div>
        <div class="field">
          <div class="field-label">Hub No.</div>
          <div class="field-value">${val(item.store_no)}</div>
        </div>
      </div>
    `;
    frag.appendChild(card);
  });
  list.appendChild(frag);
}

function search(term) {
  const t = term.trim().toLowerCase();
  if (!t) return DATA;
  return DATA.filter(item => {
    return String(item.code_bigc).includes(t) ||
           (item.hyper_store || '').toLowerCase().includes(t) ||
           (item.saka || '').toLowerCase().includes(t) ||
           (item.hub || '').toLowerCase().includes(t) ||
           String(item.store_no || '').includes(t) ||
           (item.plant || '').toLowerCase().includes(t) ||
           String(item.code_mitsu || '').includes(t);
  });
}

q.addEventListener('input', () => render(search(q.value)));
render(DATA);
</script>
</body>
</html>
